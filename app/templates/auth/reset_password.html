{% extends 'base.html' %}

{% block title %}Set New Password - Elden Care{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="care-icon-badge mx-auto mb-3">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h2 class="fw-bold text-dark mb-1">Set New Password</h2>
                    <p class="text-muted small">Please choose a secure new password for your account.</p>
                </div>

                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0" id="new_password" name="new_password" required minlength="6" placeholder="Min. 6 characters">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm New Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Re-enter password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-senior-lg w-100 fw-bold shadow-sm mb-3">
                        <i class="bi bi-check2-circle me-2"></i>Update Password
                    </button>

                    <div class="text-center text-muted small">
                        <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary">Back to Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
