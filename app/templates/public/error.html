{% extends 'base.html' %}

{% block title %}{{ error_title }} - Elden Care{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="care-card p-5 my-4">
                <div class="care-icon-badge mx-auto bg-light text-danger mb-4" style="width: 5rem; height: 5rem; font-size: 2.5rem;">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>
                <h1 class="display-5 fw-bold text-dark mb-2">{{ error_code }}</h1>
                <h3 class="h4 mb-3">{{ error_title }}</h3>
                <p class="text-muted mb-4 fs-5">{{ error_message }}</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('public.home') }}" class="btn btn-primary btn-senior-lg">
                        <i class="bi bi-house-door-fill me-2"></i>Return to Home
                    </a>
                    <a href="{{ url_for('public.contact') }}" class="btn btn-outline-primary btn-senior-lg">
                        <i class="bi bi-telephone-fill me-2"></i>Get Assistance
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
