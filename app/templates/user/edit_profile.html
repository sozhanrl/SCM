{% extends 'base.html' %}

{% block title %}Edit Profile - Elden Care{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="care-icon-badge m-0">
                        <i class="bi bi-pencil-square"></i>
                    </div>
                    <div>
                        <h3 class="h4 fw-bold mb-0">Edit Profile</h3>
                        <p class="text-muted small mb-0">Update your contact details and address</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('profile.edit_profile') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="full_name" class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control bg-light" value="{{ user.email }}" disabled readonly>
                        <small class="text-muted">Email address cannot be changed directly for identity safety.</small>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="+1 (555) 000-0000">
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label">Residential Address</label>
                        <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter home or care facility address...">{{ user.address or '' }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="{{ url_for('profile.view_profile') }}" class="btn btn-outline-secondary w-50">Cancel</a>
                        <button type="submit" class="btn btn-primary w-50 fw-bold">
                            <i class="bi bi-check-lg me-1"></i>Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
